<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>5-Digit Random Number Generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DSEG7+Classic:wght@700&family=VT323&display=swap" rel="stylesheet">
<style>
  body {
    font-family: system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    margin: 0;
    background: #0d0d0d;
  }
  #number {
    font-family: 'VT323', monospace;
    font-size: 10rem;
    letter-spacing: 0.15em;
    margin-bottom: 1.5rem;
    color: #39ff14;
    text-shadow: 0 0 10px #39ff14, 0 0 25px #39ff14, 0 0 45px rgba(57,255,20,0.6);
    background: #111;
    padding: 0.2em 0.6em;
    border-radius: 10px;
    border: 4px solid #222;
  }
  button {
    font-size: 1.1rem;
    padding: 0.6em 1.4em;
    border: none;
    border-radius: 8px;
    background: #2563eb;
    color: white;
    cursor: pointer;
  }
  button:hover {
    background: #1d4ed8;
  }
</style>
</head>
<body>
  <div id="number">00000</div>
  <button onclick="generate()">Generate</button>

  <script>
    let rolling = false;

    function generate() {
      if (rolling) return;
      rolling = true;

      const display = document.getElementById('number');
      const button = document.querySelector('button');
      button.disabled = true;

      const duration = 3000 + Math.random() * 1000; // 3-4 seconds
      const start = Date.now();

      const interval = setInterval(() => {
        display.textContent = Math.floor(10000 + Math.random() * 90000);

        if (Date.now() - start >= duration) {
          clearInterval(interval);
          display.textContent = Math.floor(10000 + Math.random() * 90000);
          button.disabled = false;
          rolling = false;
        }
      }, 60);
    }
  </script>
</body>
</html>
