<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz UI — Dark Sidebar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0c10;
    --panel: #16171d;
    --panel-2: #1d1f27;
    --border: #2a2c35;
    --text: #f4f5f7;
    --muted: #8a8d98;
    --accent: #7c8bff;
    --accent-soft: rgba(124, 139, 255, 0.14);
    --radius: 18px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    font-family: 'Inter', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
  }

  .layout {
    display: grid;
    grid-template-columns: 260px 1fr;
    min-height: 100vh;
    max-width: 1100px;
    margin: 0 auto;
  }

  .sidebar {
    border-right: 1px solid var(--border);
    padding: 2rem 1.5rem;
    display: flex;
    flex-direction: column;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    font-weight: 800;
    font-size: 1.05rem;
    margin-bottom: 2.5rem;
  }

  .brand .mark {
    width: 30px;
    height: 30px;
    border-radius: 9px;
    background: var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.85rem;
    color: #0b0c10;
  }

  .section-label {
    font-size: 0.75rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    margin: 0 0 0.9rem;
  }

  .question-list {
    display: flex;
    flex-direction: column;
    gap: 0.4rem;
    margin-bottom: 2.5rem;
  }

  .q-item {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    padding: 0.6rem 0.7rem;
    border-radius: 10px;
    font-size: 0.875rem;
    font-weight: 500;
    color: var(--muted);
  }

  .q-item .idx {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: var(--panel-2);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.7rem;
    font-weight: 700;
    flex-shrink: 0;
  }

  .q-item.answered .idx {
    background: var(--accent);
    border-color: var(--accent);
    color: #0b0c10;
  }

  .q-item.current {
    background: var(--accent-soft);
    color: var(--text);
  }

  .q-item.current .idx {
    background: var(--accent);
    border-color: var(--accent);
    color: #0b0c10;
  }

  .score-box {
    margin-top: auto;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 1rem 1.1rem;
  }

  .score-box .label {
    font-size: 0.75rem;
    color: var(--muted);
    margin-bottom: 0.3rem;
  }

  .score-box .value {
    font-size: 1.5rem;
    font-weight: 800;
  }

  .score-box .value span {
    font-size: 0.95rem;
    font-weight: 500;
    color: var(--muted);
  }

  .main {
    padding: 2.5rem 3rem;
    display: flex;
    flex-direction: column;
  }

  .main-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 2.5rem;
  }

  .pill {
    font-size: 0.75rem;
    font-weight: 600;
    padding: 0.35rem 0.8rem;
    border-radius: 999px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--muted);
  }

  .timer-ring {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    font-weight: 700;
    font-size: 1rem;
  }

  .timer-ring .ring {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: conic-gradient(var(--accent) 65%, var(--border) 0);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .timer-ring .ring::after {
    content: "";
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: var(--panel);
  }

  .question-block {
    max-width: 640px;
  }

  .question-text {
    font-size: 1.75rem;
    font-weight: 700;
    line-height: 1.35;
    margin: 0 0 2rem;
  }

  .options {
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
  }

  .option {
    display: flex;
    align-items: center;
    gap: 1rem;
    padding: 1rem 1.2rem;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--panel);
    font-size: 0.95rem;
    font-weight: 500;
    cursor: pointer;
  }

  .option .radio {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    border: 2px solid var(--border);
    flex-shrink: 0;
    position: relative;
  }

  .option.selected {
    border-color: var(--accent);
    background: var(--accent-soft);
  }

  .option.selected .radio {
    border-color: var(--accent);
  }

  .option.selected .radio::after {
    content: "";
    position: absolute;
    inset: 3px;
    border-radius: 50%;
    background: var(--accent);
  }

  .main-footer {
    margin-top: auto;
    padding-top: 2.5rem;
    display: flex;
    justify-content: flex-end;
    gap: 0.7rem;
  }

  button {
    font-family: inherit;
    font-size: 0.9rem;
    font-weight: 600;
    padding: 0.7rem 1.6rem;
    border-radius: 10px;
    border: 1px solid var(--border);
    cursor: pointer;
  }

  .btn-ghost {
    background: transparent;
    color: var(--muted);
  }

  .btn-primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #0b0c10;
  }

  @media (max-width: 780px) {
    .layout { grid-template-columns: 1fr; }
    .sidebar { display: none; }
    .main { padding: 2rem 1.5rem; }
  }
</style>
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="brand"><span class="mark">Q</span> Quizzy</div>

      <p class="section-label">Progress</p>
      <div class="question-list">
        <div class="q-item answered"><span class="idx">1</span> Question 1</div>
        <div class="q-item answered"><span class="idx">2</span> Question 2</div>
        <div class="q-item answered"><span class="idx">3</span> Question 3</div>
        <div class="q-item current"><span class="idx">4</span> Question 4</div>
        <div class="q-item"><span class="idx">5</span> Question 5</div>
        <div class="q-item"><span class="idx">6</span> Question 6</div>
        <div class="q-item"><span class="idx">7</span> Question 7</div>
      </div>

      <div class="score-box">
        <div class="label">Current score</div>
        <div class="value">240 <span>/ 300 pts</span></div>
      </div>
    </aside>

    <main class="main">
      <div class="main-top">
        <span class="pill">Science · Question 4 of 7</span>
        <div class="timer-ring"><div class="ring"></div> 00:18</div>
      </div>

      <div class="question-block">
        <h1 class="question-text">What is the chemical symbol for gold?</h1>

        <div class="options">
          <div class="option"><span class="radio"></span> Ag</div>
          <div class="option selected"><span class="radio"></span> Au</div>
          <div class="option"><span class="radio"></span> Gd</div>
          <div class="option"><span class="radio"></span> Go</div>
        </div>
      </div>

      <div class="main-footer">
        <button class="btn-ghost">Skip</button>
        <button class="btn-primary">Submit Answer</button>
      </div>
    </main>
  </div>
</body>
</html>
